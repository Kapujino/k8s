apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "41.6.1"
    helm:
      values: |
        nodeSelector:
          kubernetes.io/hostname: zbox
        deployment:
          initContainers:
            - name: wait-for-connectivity
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  deadline=$(( $(date +%s) + 600 ))
                  # Stage 1: DNS resolution (pod -> coredns -> AdGuard -> router -> WAN)
                  until getent hosts plugins.traefik.io >/dev/null 2>&1; do
                    if [ "$(date +%s)" -ge "$deadline" ]; then
                      echo "DNS for plugins.traefik.io not working after 10m; starting traefik anyway"
                      exit 0
                    fi
                    echo "waiting for DNS resolution of plugins.traefik.io..."
                    sleep 5
                  done
                  echo "DNS OK"
                  # Stage 2: egress + TLS to the actual download endpoint
                  until wget -q -T 10 -O /dev/null https://plugins.traefik.io/public/download/github.com/kvncrw/denyip/v1.3.0 2>/dev/null; do
                    if [ "$(date +%s)" -ge "$deadline" ]; then
                      echo "plugins.traefik.io not reachable after 10m; starting traefik anyway"
                      exit 0
                    fi
                    echo "waiting for egress to plugins.traefik.io..."
                    sleep 5
                  done
                  echo "egress OK"
        service:
          spec:
            type: LoadBalancer
          annotations:
            metallb.universe.tf/ip-allocated-from-pool: "default-pool"
            metallb.universe.tf/loadBalancerIPs: "192.168.1.210"
            prometheus.io/scrape: "true"
            prometheus.io/path: "/metrics"
            prometheus.io/port: "9100"
        experimental:
          plugins:
            denyip:
              moduleName: github.com/kvncrw/denyip
              version: v1.3.0
        ports:
          web:
            port: 8000
            expose: { default: true }
            exposedPort: 80
            http:
              aliasHeadersStrategy: delete
              middlewares:
                - default-block-ips@kubernetescrd
              encodedCharacters:
                allowEncodedSlash: true
                allowEncodedBackSlash: true
                allowEncodedNullCharacter: true
                allowEncodedSemicolon: true
                allowEncodedPercent: true
                allowEncodedQuestionMark: true
                allowEncodedHash: true
          websecure:
            port: 8443
            expose: { default: true }
            exposedPort: 443
            http:
              aliasHeadersStrategy: delete
              middlewares:
                - default-block-ips@kubernetescrd
              encodedCharacters:
                allowEncodedSlash: true
                allowEncodedBackSlash: true
                allowEncodedNullCharacter: true
                allowEncodedSemicolon: true
                allowEncodedPercent: true
                allowEncodedQuestionMark: true
                allowEncodedHash: true
          traefik:
            port: 8080
            expose: { default: true }
            exposedPort: 8080
            http:
              aliasHeadersStrategy: keep
          metrics:
            port: 9100
            expose: { default: true }
            exposedPort: 9100
            http:
              aliasHeadersStrategy: keep
        core:
          strictTLSOptions: true
        providers:
          kubernetesIngress:
            enabled: true
            ingressClass: traefik
            publishedService: { enabled: true }
          kubernetesCRD:
            enabled: true
            ingressClass: traefik
            defaultTLSResourcesNamespace: traefik
          kubernetesGateway: { enabled: false }
          file:              { enabled: false }
          kubernetesIngressNGINX: { enabled: false }
          knative:           { enabled: false }
        gateway:      { enabled: false }
        gatewayClass: { enabled: false }
        ingressClass:
          enabled: true
          name: traefik
          isDefaultClass: false
        rbac: { enabled: true, namespaced: false }
        api: { dashboard: true, insecure: true }
        accessLog:
          enabled: true
          # format: common   # default; set to json for machine-readable
        additionalArguments:
          - "--providers.kubernetescrd.safeNaming=false"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik
  syncPolicy:
    syncOptions:
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
    automated: {}
