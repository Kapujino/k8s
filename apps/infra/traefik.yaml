apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "41.4.0"
    helm:
      values: |
        nodeSelector:
          kubernetes.io/hostname: zbox
        service:
          spec:
            type: LoadBalancer
          annotations:
            metallb.universe.tf/ip-allocated-from-pool: "default-pool"
            metallb.universe.tf/loadBalancerIPs: "192.168.1.210"
            prometheus.io/scrape: "true"
            prometheus.io/path: "/metrics"
            prometheus.io/port: "9100"
        experimental:
          plugins:
            denyip:
              moduleName: github.com/kvncrw/denyip
              version: v1.3.0
        ports:
          web:
            port: 8000
            expose: { default: true }
            exposedPort: 80
            http:
              aliasHeadersStrategy: delete
              middlewares:
                - block-ips@kubernetescrd
              encodedCharacters:
                allowEncodedSlash: true
                allowEncodedBackSlash: true
                allowEncodedNullCharacter: true
                allowEncodedSemicolon: true
                allowEncodedPercent: true
                allowEncodedQuestionMark: true
                allowEncodedHash: true
          websecure:
            port: 8443
            expose: { default: true }
            exposedPort: 443
            http:
              aliasHeadersStrategy: delete
              middlewares:
                - block-ips@kubernetescrd
              encodedCharacters:
                allowEncodedSlash: true
                allowEncodedBackSlash: true
                allowEncodedNullCharacter: true
                allowEncodedSemicolon: true
                allowEncodedPercent: true
                allowEncodedQuestionMark: true
                allowEncodedHash: true
          traefik:
            port: 8080
            expose: { default: true }
            exposedPort: 8080
            http:
              aliasHeadersStrategy: keep
          metrics:
            port: 9100
            expose: { default: true }
            exposedPort: 9100
            http:
              aliasHeadersStrategy: keep
        core:
          strictTLSOptions: true
        providers:
          kubernetesIngress:
            enabled: true
            ingressClass: traefik
            publishedService: { enabled: true }
          kubernetesCRD:
            enabled: true
            ingressClass: traefik
            defaultTLSResourcesNamespace: traefik
          kubernetesGateway: { enabled: false }
          file:              { enabled: false }
          kubernetesIngressNGINX: { enabled: false }
          knative:           { enabled: false }
        gateway:      { enabled: false }
        gatewayClass: { enabled: false }
        ingressClass:
          enabled: true
          name: traefik
          isDefaultClass: false
        rbac: { enabled: true, namespaced: false }
        api: { dashboard: true, insecure: true }
        accessLog:
          enabled: true
          # format: common   # default; set to json for machine-readable
        additionalArguments:
          - "--providers.kubernetescrd.safeNaming=false"
        extraObjects:
          - apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: block-ips
              namespace: default
            spec:
              plugin:
                denyip:
                  ipDenyList:
                    - 172.191.149.99
                    - 20.220.10.235
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik
  syncPolicy:
    syncOptions:
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
    automated: {}
