---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metallb-system

#https://metallb.universe.tf/installation/
resources:
  - github.com/metallb/metallb/config/native?ref=v0.16.1
  - metallb_ip_range.yaml

# MetalLB v0.16 native manifests annotate the pods for prometheus scraping
# (scrape=true, port=9120) but 9120 is the HTTPS metrics port and the
# scheme annotation is missing, so prometheus scraped plain HTTP and got
# 400 on all 4 targets. Add the scheme so the existing prometheus.io/scheme
# relabel in prometheus' kubernetes-pods job switches those targets to https.
patches:
  - path: speaker-prom-patch.yaml
  - path: controller-prom-patch.yaml

# MetalLB v0.16 serves :9120 with native TLS + RBAC auth
# (controller-runtime WithAuthenticationAndAuthorization filter): the
# speaker/controller must be able to create TokenReviews and
# SubjectAccessReviews to authenticate/authorize the scraper, otherwise
# every scrape fails with 401/500. Mirrors upstream
# config/prometheus-native/rbac-patch.yaml (v0.16.1). The scraper side is
# already covered: prometheus runs as monitoring/default, bound to the
# "prometheus" ClusterRole which allows get on nonResourceURLs /metrics,
# and presents its SA token via bearer_token_file in prometheus.yml.
patchesJson6902:
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: metallb-system:controller
    path: rbac-metrics-patch.yaml
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: metallb-system:speaker
    path: rbac-metrics-patch.yaml
